<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Insurance Core – Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="light">
  <div class="bg-mesh">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-theme-bar">
      <button id="themeToggleBtn" class="theme-toggle-btn" type="button" title="Toggle Theme (Default: Light Mode)">
        <span id="themeIcon">☀️</span>
        <span id="themeLabel">Light</span>
      </button>
    </div>
    <div class="glass-card">
      <div class="card-header">
        <div class="brand-badge">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>KINSURE+</span>
        </div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Life Insurance Core Management System</p>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="input-group">
          <label for="username">User ID / Username</label>
          <div class="input-field">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-field">
            <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
            <button type="button" id="togglePassword" class="icon-btn" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-actions">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" />
            <span class="custom-checkbox"></span>
            <span>Remember Me</span>
          </label>
          <a href="#" class="forgot-link">Need help?</a>
        </div>

        <button type="submit" id="submitBtn" class="primary-btn">
          <span class="btn-text">Sign In to Core</span>
          <div class="spinner hidden" id="spinner"></div>
        </button>
      </form>

      <div id="alertBox" class="alert hidden" role="alert">
        <svg id="alertIcon" class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
        <span id="alertMsg"></span>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
